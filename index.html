<!DOCTYPE html>
<html>
<head>
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }

    input {
      padding: 8px;
      width: 200px;
    }

    button {
      padding: 8px 15px;
    }

    #result {
      margin-top: 30px;
      border: 1px solid black;
      padding: 20px;
      width: 250px;
      margin-left: auto;
      margin-right: auto;
      display: none;
    }

    #error {
      color: red;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h2>Weather App</h2>

  <input type="text" id="city" placeholder="Enter city">
  <button onclick="getWeather()">Get Weather</button>

  <p id="error"></p>

  <div id="result">
    <h3 id="location"></h3>
    <p id="temp"></p>
    <p id="desc"></p>
    <p id="humidity"></p>
    <p id="wind"></p>
  </div>

  <script>
    function getWeather() {
      var city = document.getElementById("city").value;
      document.getElementById("error").innerHTML = "";
      document.getElementById("result").style.display = "none";

      if (city == "") {
        document.getElementById("error").innerHTML = "Please enter a city";
        return;
      }

      // get location
      fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + city + "&count=1")
        .then(function(res) {
          return res.json();
        })
        .then(function(data) {
          if (!data.results) {
            document.getElementById("error").innerHTML = "City not found";
            return;
          }

          var lat = data.results[0].latitude;
          var lon = data.results[0].longitude;
          var name = data.results[0].name;
          var country = data.results[0].country;

          // get weather
          fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m")
            .then(function(res) {
              return res.json();
            })
            .then(function(weather) {
              var temp = weather.current.temperature_2m;
              var humidity = weather.current.relative_humidity_2m;
              var wind = weather.current.wind_speed_10m;
              var code = weather.current.weather_code;

              var desc = "Unknown";
              if (code == 0) desc = "Clear";
              else if (code == 1 || code == 2 || code == 3) desc = "Cloudy";
              else if (code >= 51 && code <= 67) desc = "Rain";
              else if (code >= 71 && code <= 77) desc = "Snow";
              else if (code >= 80) desc = "Showers";
              else if (code >= 95) desc = "Thunderstorm";

              document.getElementById("location").innerHTML = name + ", " + country;
              document.getElementById("temp").innerHTML = "Temperature: " + Math.round(temp) + "°C";
              document.getElementById("desc").innerHTML = "Condition: " + desc;
              document.getElementById("humidity").innerHTML = "Humidity: " + humidity + "%";
              document.getElementById("wind").innerHTML = "Wind: " + Math.round(wind) + " km/h";

              document.getElementById("result").style.display = "block";
            });
        })
        .catch(function() {
          document.getElementById("error").innerHTML = "Something went wrong";
        });
    }
  </script>

</body>
</html>
